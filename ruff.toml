indent-width = 4
line-length = 100
target-version = "py312"

extend-exclude = [
    "debian/vllm/fixes",
]

[lint]
select = ["ALL"]
ignore = [
    "A003",
    "ANN002",
    "ANN003",
    "ANN401",
    "BLE001",
    "C901",
    "COM812",
    "CPY001",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D202",
    "D203",
    "D205",
    "D211",
    "D212",
    "D213",
    "D400",
    "D401",
    "D406",
    "D407",
    "D415",
    "D417",
    "ERA001",
    "FBT001",
    "FBT002",
    "G004",
    "I001",
    "INP001",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLW2901",
    "PT019",
    "PTH123",
    "RUF012",
    "Q000",
    "Q003",
    "S101",
    "S301",
    "S311",
    "S603",
    "SLF001",
    "T201",
    "UP015",
    "UP035",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[lint.mccabe]
max-complexity = 6
